name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Change to "master" if your default branch is master

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps: deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/pages-infrastructure-by-pages@v1 # Optional but configures basic pages adjustments

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # The directory containing your static files (e.g., 'dist', 'build', or '.')

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
